<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High School Basketball Recruiting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- BANNER SUPERIOR ÚNICO -->
        <div class="espn-top-banner">
            <h2>Recruiting Database</h2>
            <button class="theme-btn" id="theme-toggle" title="Alternar Tema">
                <img id="theme-icon" src="https://png.pngtree.com/png-vector/20221128/ourmid/pngtree-icon-of-sun-png-image_6484830.png" alt="Modo Claro">
            </button>
        </div>

        <!-- SUB-HEADER -->
        <div class="espn-subheader">
            <div class="subheader-left">
                <a href="#" class="back-link">Back to Ranking Index</a>
                <div class="brand-title">
                    <img src="https://a.espncdn.com/combiner/i?img=/i/recruiting/logos/2025/scnext.png&w=160" alt="SCNEXT" class="scnext-header-logo">
                    <span class="class-title" id="class-title-text">2029 SCNEXT 100</span>
                </div>
            </div>
            
            <div class="subheader-right">
                <select id="year-filter" class="espn-year-select">
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029" selected>2029</option>
                    <option value="2030">2030</option>
                </select>
                <button class="add-btn" id="open-modal-btn">+ Novo Recruta</button>
            </div>
        </div>

        <!-- BUSCA E TABELA CONTINUAM ABAIXO -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar jogador por nome ou escola...">
        </div>

        <table class="recruiting-table espn-style">
            <thead>
                <tr>
                    <th>RK</th>
                    <th>PLAYER</th>
                    <th>POS</th>
                    <th>HOMETOWN</th>
                    <th>HT</th>
                    <th>WT</th>
                    <th>STARS</th>
                    <th>GRADE</th>
                    <th>SCHOOL</th>
                </tr>
            </thead>
            <tbody id="players-table-body">
                <!-- Renderizado via JS -->
            </tbody>
        </table>
    </div>

    <!-- MODAL DE CADASTRO -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h2>Cadastrar Novo Recruta</h2>
            <form id="add-player-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ranking:</label>
                        <input type="number" id="rank_position" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Nome:</label>
                        <input type="text" id="name_player" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Posição (ex: PG, SF):</label>
                        <input type="text" id="position_player" required>
                    </div>
                    <div class="form-group">
                        <label>Ano da Classe (ex: 2026):</label>
                        <input type="number" id="class_year" value="2026" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Altura (ex: 6-3):</label>
                        <input type="text" id="height" required>
                    </div>
                    <div class="form-group">
                        <label>Peso (lbs):</label>
                        <input type="number" id="weight_lbs">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>High School / Escola:</label>
                        <input type="text" id="high_school">
                    </div>
                    <div class="form-group">
                        <label>Cidade / Cidade Natal:</label>
                        <input type="text" id="hometown" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Estrelas (1 a 5):</label>
                        <input type="number" id="stars" min="1" max="5" value="5" required>
                    </div>
                    <div class="form-group">
                        <label>Nota / Grade (0-99):</label>
                        <input type="number" id="grade" min="0" max="99" value="95" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Faculdade Comprometida (ou Uncommitted):</label>
                    <select id="college_id">
                        <option value="">Uncommitted (Sem compromisso)</option>
                        <option value="1">Gonzaga</option>
                        <option value="2">Duke</option>
                        <option value="3">Kentucky</option>
                        <option value="4">Florida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>URL do Logo da Faculdade:</label>
                    <input type="text" id="college_logo" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Data do Compromisso:</label>
                    <input type="date" id="commit_date">
                </div>

                <button type="submit" class="submit-btn">Salvar Recruta</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
